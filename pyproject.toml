[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rustruct"
version = "0.1.0"
description = "Rust core for parsing and building binary wire formats from Python"
authors = [{ name = "Dmitry Orlov", email = "orlovdl@gmail.com" }]
keywords = [
    "binary",
    "struct",
    "codec",
    "wire-format",
    "parser",
    "pyo3",
    "rust",
]
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python",
    "Programming Language :: Rust",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mosquito/rustruct"
Documentation = "https://mosquito.github.io/rustruct/"
Source = "https://github.com/mosquito/rustruct"
Tracker = "https://github.com/mosquito/rustruct/issues"

[dependency-groups]
dev = ["markdown-pytest>=0.6.5", "maturin>=1.7,<2.0", "msgpack>=1.0", "pytest>=8", "ty", "ruff"]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
]

[tool.maturin]
python-source = "src"
module-name = "rustruct.core"
manifest-path = "crates/rustruct-py/Cargo.toml"
features = ["pyo3/abi3-py311", "rustruct-py/experimental-inspect"]
include = ["COPYING"]

[tool.ruff]
line-length = 119
src = ["src", "tests"]
extend-exclude = ["src/rustruct/core.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs", "README.md"]

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rustruct"
version = "0.1.0"
description = "Rust core for parsing and building binary wire formats from Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["markdown-pytest>=0.6.5", "msgpack>=1.0", "pytest>=8", "ty", "ruff"]
docs = [
    "furo",
    "myst-parser",
    "sphinx",
]

[tool.maturin]
python-source = "src"
module-name = "rustruct.core"
manifest-path = "crates/rustruct-py/Cargo.toml"
features = ["pyo3/abi3-py311"]

[tool.ruff]
line-length = 119
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ty.environment]
python-version = "3.11"
root = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "docs", "README.md"]

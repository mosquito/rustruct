name: publish

on:
  release:
    types: [published]

env:
  FORCE_COLOR: 1

jobs:
  linux:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64
            manylinux: auto
            runs-on: ubuntu-latest
          - target: aarch64
            manylinux: auto
            runs-on: ubuntu-24.04-arm
          - target: x86_64
            manylinux: musllinux_1_2
            runs-on: ubuntu-latest
          - target: aarch64
            manylinux: musllinux_1_2
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Set version from tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: ${{ matrix.manylinux }}

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.manylinux }}
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Set version from tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist

  windows:
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x64
            runs-on: windows-latest
          - target: aarch64
            runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Set version from tag
        shell: bash
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Set version from tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Install each built wheel under every Python version rustruct claims to
  # support (requires-python = ">=3.11") and run the real test suite against
  # it. abi3 means a single wheel per platform covers all of them, but that's
  # a claim, not a guarantee -- this is what actually checks it, on real
  # native hardware for every architecture we ship (no QEMU emulation).
  verify:
    needs: [ linux, macos, windows ]
    runs-on: ${{ matrix.variant.os }}
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.11', '3.12', '3.13', '3.14' ]
        variant:
          - name: linux-x86_64
            os: ubuntu-latest
            artifact: wheels-linux-x86_64-auto
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64-auto
          - name: macos-arm64
            os: macos-latest
            artifact: wheels-macos
          - name: macos-x86_64
            os: macos-13
            artifact: wheels-macos
          - name: windows-x64
            os: windows-latest
            artifact: wheels-windows-x64
          - name: windows-arm64
            os: windows-11-arm
            artifact: wheels-windows-aarch64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.variant.artifact }}
          path: dist

      - name: Install test dependencies
        run: python -m pip install pytest msgpack

      - name: Install the built wheel
        run: python -m pip install --no-index --find-links dist rustruct

      - name: Run tests against the installed wheel
        run: python -m pytest tests -q

  # musllinux wheels only install on a musl libc, so they need their own
  # Alpine container rather than the plain runners used by `verify` above.
  verify-musllinux:
    needs: [ linux ]
    runs-on: ${{ matrix.arch.os }}
    container: python:${{ matrix.python }}-alpine
    strategy:
      fail-fast: false
      matrix:
        python: [ '3.11', '3.12', '3.13', '3.14' ]
        arch:
          - os: ubuntu-latest
            artifact: wheels-linux-x86_64-musllinux_1_2
          - os: ubuntu-24.04-arm
            artifact: wheels-linux-aarch64-musllinux_1_2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.arch.artifact }}
          path: dist

      - name: Install test dependencies
        run: pip install pytest msgpack

      - name: Install the built wheel
        run: pip install --no-index --find-links dist rustruct

      - name: Run tests against the installed wheel
        run: python -m pytest tests -q

  publish:
    needs: [ linux, macos, windows, sdist, verify, verify-musllinux ]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload wheels to GitHub Release
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
